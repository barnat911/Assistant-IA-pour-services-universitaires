<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Absences - UniAssist IA</title>
    <link rel="stylesheet" href="absences.css">
</head>
<body>

<header>
    <h1>🎓 UniAssist IA</h1>
    <p>Gestion des Absences Étudiantes</p>
</header>

<section class="absence-container">
    <h2>📝 Déclarer une Absence</h2>

    <form>

        <div class="form-group">
            <label>Date de l'absence</label>
            <input type="date" required>
        </div>

        <div class="form-group">
            <label>Motif</label>
            <select required>
                <option value="">-- Sélectionner --</option>
                <option>Maladie</option>
                <option>Rendez-vous administratif</option>
                <option>Voyage personnel</option>
                <option>Autre</option>
            </select>
        </div>

        <div class="form-group">
            <label>Justificatif (PDF, JPG, PNG)</label>
            <input type="file" accept=".pdf,.jpg,.png" required>
        </div>

        <div class="form-group">
            <label>Commentaire (optionnel)</label>
            <textarea placeholder="Ex: Consultation médicale le matin"></textarea>
        </div>

        <button type="submit">📤 Soumettre l'absence</button>

    </form>
</section>

<section class="historique">
    <h2>📊 Historique des absences</h2>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Motif</th>
                <th>Statut</th>
                <th>Commentaire</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>12/02/2026</td>
                <td>Maladie</td>
                <td class="valide">Validé</td>
                <td>Certificat médical reçu</td>
            </tr>
            <tr>
                <td>18/02/2026</td>
                <td>Rendez-vous administratif</td>
                <td class="attente">En attente</td>
                <td>-</td>
            </tr>
        </tbody>
    </table>
</section>

<footer>
    <p>© 2026 UniAssist IA - Projet PFE</p>
</footer>
<!-- Bouton flottant IA sur page Absences -->
<button id="absenceAIbtn">💡 Assistant Absences</button>

<div id="absenceAIchat" style="display:none; border:1px solid #004080; padding:10px; width:350px; position:fixed; bottom:20px; right:20px; background:white;">
  <textarea id="absenceQuestion" placeholder="Posez votre question sur les absences..." rows="3" style="width:100%;"></textarea>
  <button onclick="askAbsenceAI()">Envoyer</button>
  <div id="absenceResponse" style="margin-top:10px;"></div>
</div>

<script>
document.getElementById("absenceAIbtn").onclick = () => {
    document.getElementById("absenceAIchat").style.display = "block";
}

async function askAbsenceAI() {
    const question = document.getElementById("absenceQuestion").value;
    const res = await fetch("/api/ai-absence", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
    });
    const data = await res.json();
    document.getElementById("absenceResponse").innerHTML = data.answer;
}
</script>
</body>
</html>
